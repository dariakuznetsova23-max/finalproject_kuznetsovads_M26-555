[project]
name = "finalproject-kuznetsovads-m26-555"
version = "0.1.0"
description = "Console currency wallet and exchange-rate parser"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "prettytable>=3.12,<4",
    "requests>=2.32,<3",
]

[project.scripts]
valutatrade = "valutatrade_hub.cli.interface:main"
valutatrade-parser = "valutatrade_hub.parser_service.scheduler:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["valutatrade_hub"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.valutatrade]
data_dir = "data"
logs_dir = "logs"
rates_ttl_seconds = 300
default_base_currency = "USD"
log_level = "INFO"
log_format = "%(levelname)s %(asctime)s %(message)s"
log_max_bytes = 1048576
log_backup_count = 3
storage_lock_timeout = 10

[dependency-groups]
dev = [
    "ruff>=0.11,<1",
]
